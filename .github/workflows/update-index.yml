name: Update current affairs list

on:
  push:
    branches: [main]
    paths:
      - 'current_affairs/*.pdf'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build current_affairs/index.json
        run: |
          python3 - <<'PY'
          import json, os, re
          items = []
          for f in os.listdir('current_affairs'):
              if not f.lower().endswith('.pdf'):
                  continue
              base = f[:-4]
              m = re.match(r'^(\d{4}-\d{2}-\d{2})[\s_-]*(.*)$', base)
              items.append({
                  'file': f,
                  'date': m.group(1) if m else '',
                  'title': (m.group(2) if m and m.group(2) else base),
              })
          items.sort(key=lambda x: (x['date'], x['title']), reverse=True)
          with open('current_affairs/index.json', 'w', encoding='utf-8') as out:
              json.dump(items, out, ensure_ascii=False, indent=1)
          PY

      - name: Commit the list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add current_affairs/index.json
          git diff --cached --quiet || (git commit -m "Update current affairs list" && git push)
